name: Daily ticker
on:
  schedule:
    - cron: "30 8 * * *"  # Gemini RPD quota resets at midnight Pacific (08:00 UTC)
    - cron: "30 14 * * *"  # backup: GitHub can start schedules hours late or drop them
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ticker/**", "static/**", ".github/workflows/daily.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ticker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch tip, not the queued SHA: a queued run must see the data the run before it committed, not the SHA it was queued at
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, edit and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-4-hydrogen' }}
          AI_DISABLED: ${{ github.event_name == 'push' && '1' || '' }}  # code-update runs keep the daily Gemini quota for the scheduled run
        run: python -m ticker.run --data-dir data --out-dir public ${{ github.event_name == 'schedule' && '--skip-if-ran-today' || '' }}
      - name: Commit data
        run: |
          git config user.name "agent-ticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily run $(date -u +%F)"
          git pull --rebase -X theirs && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
