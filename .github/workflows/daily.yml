name: Daily ticker
on:
  schedule:
    - cron: "30 8 * * *"  # Gemini RPD quota resets at midnight Pacific (08:00 UTC)
    - cron: "30 14 * * *"  # backup: GitHub can start schedules hours late or drop them
  workflow_dispatch:
    inputs:
      brevo_action:
        description: "Brevo newsletter action"
        required: false
        default: full
        type: choice
        options: [full, send-only, verify-only, list-status]
  push:
    branches: [main]
    paths: ["ticker/**", "static/**", ".github/workflows/daily.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ticker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch tip, not the queued SHA: a queued run must see the data the run before it committed, not the SHA it was queued at
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, edit and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-4-hydrogen' }}
          BREVO_ACTION: ${{ inputs.brevo_action || 'full' }}
          BREVO_SIGNUP_URL: ${{ vars.BREVO_SIGNUP_URL }}
        run: |
          args="${{ github.event_name == 'schedule' && '--skip-if-ran-today' || '' }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$BREVO_ACTION" != "full" ]; then
            args="--build-only"  # push and newsletter-only runs never spend Gemini quota
          fi
          python -m ticker.run --data-dir data --out-dir public $args
      - name: Send daily Brevo newsletter
        if: ${{ github.event_name != 'push' && inputs.brevo_action != 'verify-only' && inputs.brevo_action != 'list-status' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_LIST_NAME: ${{ vars.BREVO_LIST_NAME }}
          BREVO_SENDER_ID: ${{ vars.BREVO_SENDER_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
        run: python -m ticker.brevo --data-dir data --send
      - name: Verify daily Brevo newsletter
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.brevo_action == 'verify-only' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python -m ticker.brevo --data-dir data --verify
      - name: Check Brevo list status
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.brevo_action == 'list-status' }}
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_LIST_NAME: ${{ vars.BREVO_LIST_NAME }}
        run: python -m ticker.brevo --data-dir data --list-status
      - name: Commit data
        run: |
          git config user.name "agent-ticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily run $(date -u +%F)"
          git pull --rebase -X theirs && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
