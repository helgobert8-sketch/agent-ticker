name: Daily ticker
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ticker/**", "static/**", ".github/workflows/daily.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ticker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, edit and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-4-hydrogen' }}
        run: python -m ticker.run --data-dir data --out-dir public
      - name: Commit data
        run: |
          git config user.name "agent-ticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily run $(date -u +%F)"
          git pull --rebase -X theirs && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
